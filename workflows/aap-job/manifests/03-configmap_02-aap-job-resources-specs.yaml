apiVersion: v1
data:
  aap-openapi.yaml: |
    openapi: 3.0.3
    info:
      title: The AAP Controller API
      version: v2

    # Base URL pointing to the controller
    servers:
      - url: https://aap-aap.apps.cluster-xtvv4-1.dynamic.redhatworkshops.io

    paths:
      /api/controller/v2/job_templates/{job_template_id}/launch/:
        post:
          description: Launch a job from a template id
          operationId: launchJob
          parameters:
            - name: job_template_id
              in: path
              required: true
              schema:
                type: integer
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LaunchJobRequest"
          responses:
            "201":
              description: Job launched successfully
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/LaunchJobResponse"
            "401":
              description: Unauthorized
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/UnauthorizedError"
          security:
            - basicAuth: []

      /api/controller/v2/jobs/{job_id}/:
        get:
          description: Retrieve a job from a job id
          operationId: getJob
          parameters:
            - name: job_id
              in: path
              required: true
              schema:
                type: integer
          responses:
            "200":
              description: Success
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/GetJobResponse"
            "401":
              description: Unauthorized
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/UnauthorizedError"
          security:
            - basicAuth: []

    components:
      securitySchemes:
        basicAuth:
          type: http
          scheme: basic

      schemas:
        LaunchJobRequest:
          type: object
          properties:
            limit:
              type: string
            extra_vars:
              type: object
              properties:
                rhel_inventory_group:
                  type: string
                targetNamespace:
                  type: string
          additionalProperties: false

        LaunchJobResponse:
          type: object
          properties:
            id:
              type: integer
            failed:
              type: boolean
            status:
              type: string
          additionalProperties: false

        GetJobResponse:
          type: object
          properties:
            id:
              type: integer
            failed:
              type: boolean
            status:
              type: string
          additionalProperties: false

        UnauthorizedError:
          type: object
          properties:
            detail:
              type: string
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: 02-aap-job-resources-specs
